<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق المشغل المباشر | PWA Player</title>

  <!-- PWA Manifest & Theme -->
  <meta name="theme-color" content="#1a1a24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HLS.js Library for M3U8 Streams -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      background-color: #0f0f15;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .video-aspect {
      aspect-ratio: 16 / 9;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- Header / Navbar -->
  <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-red-500 flex items-center gap-2">
        <span>📺</span> مشغل القنوات المباشرة
      </h1>
      <span class="text-xs bg-red-600/20 text-red-400 px-3 py-1 rounded-full border border-red-500/30">PWA Active</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 flex flex-col md:flex-row gap-6">
    
    <!-- Player Section -->
    <div class="flex-1 flex flex-col gap-4">
      <div id="player-container" class="relative w-full bg-black rounded-xl overflow-hidden shadow-2xl border border-gray-800 video-aspect flex items-center justify-center">
        <!-- HLS HTML5 Video Player -->
        <video id="video-player" class="w-full h-full object-contain hidden" controls autoplay playsinline></video>
        
        <!-- Iframe Player -->
        <iframe id="iframe-player" class="w-full h-full border-0 hidden" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        
        <!-- Placeholder / Loader -->
        <div id="player-placeholder" class="text-center p-6">
          <p class="text-gray-400 text-lg">اختر قناة من القائمة لبدء التشغيل</p>
        </div>
      </div>

      <!-- Channel Info -->
      <div class="bg-gray-900 p-4 rounded-xl border border-gray-800">
        <h2 id="current-channel-title" class="text-lg font-bold text-gray-200">لم يتم اختيار قناة</h2>
        <p id="current-channel-type" class="text-xs text-gray-400 mt-1">الرجاء تحديد قناة لمشاهدة البث</p>
      </div>
    </div>

    <!-- Sidebar / Channel List -->
    <aside class="w-full md:w-80 bg-gray-900 p-4 rounded-xl border border-gray-800 h-fit">
      <h3 class="text-md font-bold mb-4 text-gray-300 border-b border-gray-800 pb-2 flex justify-between items-center">
        <span>قائمة القنوات</span>
        <span id="channel-count" class="text-xs text-gray-500">0 قنوات</span>
      </h3>
      <div id="channel-list" class="flex flex-col gap-2 max-h-[500px] overflow-y-auto pr-1">
        <!-- القنوات تضاف هنا عبر JavaScript -->
      </div>
    </aside>

  </main>

  <script>
    // =========================================================
    // 1. رابط الـ Cloudflare Worker الخاص بك
    // =========================================================
    const PROXY_URL = 'https://iptv-proxy.albarashdi003.workers.dev/?url=';

    // =========================================================
    // 2. مصفوفة القنوات الشاملة
    // =========================================================
    const CHANNELS = [
      // --- قنوات IPTV (الصورة الثانية) ---
      {
        id: 'bein-1-4k',
        name: 'beIN SPORTS 1 4K',
        type: 'hls',
        url: PROXY_URL + encodeURIComponent('http://80.211.189.193/live/get.php?stream=27&username=76097116161695&password=76097116161695')
      },
      {
        id: 'bein-2-4k',
        name: 'beIN SPORTS 2 4K',
        type: 'hls',
        url: PROXY_URL + encodeURIComponent('http://80.211.189.193/live/get.php?stream=28&username=76097116161695&password=76097116161695')
      },
      {
        id: 'bein-3-4k',
        name: 'beIN SPORTS 3 4K',
        type: 'hls',
        url: PROXY_URL + encodeURIComponent('http://80.211.189.193/live/get.php?stream=29&username=76097116161695&password=76097116161695')
      },
      {
        id: 'bein-4-4k',
        name: 'beIN SPORTS 4 4K',
        type: 'hls',
        url: PROXY_URL + encodeURIComponent('http://80.211.189.193/live/get.php?stream=30&username=76097116161695&password=76097116161695')
      },

      // --- قنوات live-k24 (الصورة الثالثة) ---
      {
        id: 'bein-1-k24',
        name: 'beIN SPORTS 1 (سيرفر 2)',
        type: 'hls',
        url: PROXY_URL + encodeURIComponent('http://live-k24.rhcloud.com/BeinSport/BeinSport.m3u8?ch=1')
      },
      {
        id: 'bein-2-k24',
        name: 'beIN SPORTS 2 (سيرفر 2)',
        type: 'hls',
        url: PROXY_URL + encodeURIComponent('http://live-k24.rhcloud.com/BeinSport/BeinSport.m3u8?ch=2')
      },
      {
        id: 'bein-3-k24',
        name: 'beIN SPORTS 3 (سيرفر 2)',
        type: 'hls',
        url: PROXY_URL + encodeURIComponent('http://live-k24.rhcloud.com/BeinSport/BeinSport.m3u8?ch=3')
      },

      // --- قنوات Iframe الثابتة (YasirTV) ---
      {
        id: 'bein-1-iframe',
        name: 'beIN SPORTS 1 (YasirTV)',
        type: 'iframe',
        url: 'https://912acsss8af382.yasirtv.com/playerv5.php?match=4750841&key=9f39972b67d6ce22189507d008acwc26'
      },
      {
        id: 'bein-2-iframe',
        name: 'beIN SPORTS 2 (YasirTV)',
        type: 'iframe',
        url: 'https://912acsss8af382.yasirtv.com/playerv5.php?match=4750842&key=9f39972b67d6ce22189507d008acwc26'
      }
    ];

    // عناصر الواجهة
    const videoPlayer = document.getElementById('video-player');
    const iframePlayer = document.getElementById('iframe-player');
    const placeholder = document.getElementById('player-placeholder');
    const channelListContainer = document.getElementById('channel-list');
    const currentChannelTitle = document.getElementById('current-channel-title');
    const currentChannelType = document.getElementById('current-channel-type');
    const channelCount = document.getElementById('channel-count');

    let hlsInstance = null;

    // بناء قائمة القنوات
    function renderChannels() {
      channelListContainer.innerHTML = '';
      channelCount.textContent = `${CHANNELS.length} قنوات`;

      CHANNELS.forEach((channel) => {
        const btn = document.createElement('button');
        btn.className = 'w-full text-right p-3 rounded-lg bg-gray-800 hover:bg-gray-700 transition flex items-center justify-between border border-gray-700/50';
        btn.innerHTML = `
          <span class="font-medium text-sm text-gray-200">${channel.name}</span>
          <span class="text-[10px] px-2 py-0.5 rounded bg-gray-900 text-gray-400 border border-gray-700">${channel.type.toUpperCase()}</span>
        `;
        btn.onclick = () => playChannel(channel);
        channelListContainer.appendChild(btn);
      });
    }

    // تشغيل القناة المختارة
    function playChannel(channel) {
      currentChannelTitle.textContent = channel.name;
      currentChannelType.textContent = `النوع: ${channel.type.toUpperCase()} | البث المباشر`;

      placeholder.classList.add('hidden');

      if (channel.type === 'hls') {
        // إيقاف الـ Iframe
        iframePlayer.classList.add('hidden');
        iframePlayer.src = '';

        // إظهار مشغل الفيديو
        videoPlayer.classList.remove('hidden');

        if (hlsInstance) {
          hlsInstance.destroy();
        }

        if (Hls.isSupported()) {
          hlsInstance = new Hls();
          hlsInstance.loadSource(channel.url);
          hlsInstance.attachMedia(videoPlayer);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            videoPlayer.play();
          });
        } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
          // لدعم متصفح Safari على iOS
          videoPlayer.src = channel.url;
          videoPlayer.play();
        }
      } else if (channel.type === 'iframe') {
        // إيقاف مشغل HLS
        if (hlsInstance) {
          hlsInstance.destroy();
        }
        videoPlayer.pause();
        videoPlayer.classList.add('hidden');

        // إظهار الـ Iframe
        iframePlayer.classList.remove('hidden');
        iframePlayer.src = channel.url;
      }
    }

    // التهيئة عند تحميل الصفحة
    document.addEventListener('DOMContentLoaded', () => {
      renderChannels();
    });
  </script>
</body>
</html>
